<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVF Hérault — prix au m²</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#16201f; --rule:#d5dcda; --accent:#0b6560; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.55 system-ui, sans-serif; color:var(--ink); background:#f3f5f4 }
  header { padding:22px 24px; border-bottom:2px solid var(--ink); background:#fff }
  h1 { margin:0; font-size:22px }
  h2 { font-size:16px; margin:0 0 12px }
  main { max-width:1080px; margin:0 auto; padding:24px; display:grid; gap:20px }
  section { background:#fff; border:1px solid var(--rule); padding:18px }
  table { border-collapse:collapse; width:100% }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#5e6b69 }
  #carte { height:460px; border:1px solid var(--rule) }
  .legende { background:rgba(255,255,255,.92); padding:8px 10px; border:1px solid var(--rule);
             font-size:12px; line-height:1.5; box-shadow:0 1px 4px rgba(0,0,0,.15) }
  .legende strong { display:block; margin-bottom:4px; font-size:11px; letter-spacing:.05em;
                    text-transform:uppercase; color:#5e6b69 }
  .legende span { display:flex; align-items:center; gap:6px }
  .legende i { width:12px; height:12px; display:inline-block; border-radius:2px }
  .compte { font-size:13px; color:#5e6b69; margin-bottom:10px }
  .err { color:#b03a1e; font-family:monospace; font-size:13px }
</style>
</head>
<body>
<header><h1>DVF Hérault — prix au m², 2024</h1></header>
<main>
  <section>
    <h2>Q1 · Les 10 communes les plus chères (≥ 30 ventes)</h2>
    <div id="q1"></div>
  </section>
  <section>
    <h2>Q2 · Évolution mensuelle du prix moyen au m²</h2>
    <canvas id="q2" height="110"></canvas>
    <div id="q2err"></div>
  </section>
  <section>
    <h2>Q3 · Appartements vendus à moins de 5 km du centre de Montpellier</h2>
    <p class="compte" id="q3count"></p>
    <div id="carte"></div>
    <div id="q3err"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
